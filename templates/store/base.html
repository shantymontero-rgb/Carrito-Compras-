<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CentralMarket{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #157347;
            --brand-dark: #0b3d26;
            --brand-accent: #ff6b6b;
            --bg-body: #f5fbf7;
            --card-border: #e1f0e8;
        }
        body {
            background-color: var(--bg-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1c2d24;
        }
        .navbar-central {
            background: linear-gradient(135deg, #0b3d26 0%, #157347 100%);
            border-bottom: 3px solid #20c997;
        }
        .card-matcha {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(21, 115, 71, 0.05);
            transition: all 0.25s ease-in-out;
        }
        .card-matcha:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(21, 115, 71, 0.12);
            border-color: #20c997;
        }
        .btn-matcha {
            background-color: var(--brand-primary);
            color: #ffffff;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-matcha:hover {
            background-color: var(--brand-dark);
            color: #ffffff;
            transform: scale(1.02);
        }
        .btn-accent {
            background-color: var(--brand-accent);
            color: #ffffff;
            border-radius: 50px;
            font-weight: 600;
            border: none;
        }
        .btn-accent:hover {
            background-color: #fa5252;
            color: #ffffff;
        }
        .badge-cat {
            background-color: #e8f7ee;
            color: #157347;
            font-weight: 600;
            border-radius: 8px;
            padding: 6px 12px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-central py-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="/">
                <span class="p-2 bg-white bg-opacity-10 rounded-circle me-2 d-inline-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                    <i class="bi bi-bag-check-fill text-warning fs-5"></i>
                </span>
                Central<span class="text-warning">Market</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-white active fw-semibold" href="/"><i class="bi bi-shop me-1"></i> Explorar Tienda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50 fw-semibold" href="/cart/"><i class="bi bi-basket2-fill me-1"></i> Mi Cesta</a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a href="/login/" id="btnLogin" class="btn btn-outline-light btn-sm px-4 rounded-pill fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                        </a>
                        <button id="btnLogout" class="btn btn-accent btn-sm px-4 rounded-pill d-none" onclick="logout()">
                            <i class="bi bi-box-arrow-left me-1"></i> Salir
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-white py-4 border-top text-center mt-auto" style="border-color: #e1f0e8 !important;">
        <p class="mb-0 small text-muted">🛒 <strong>CentralMarket</strong> • Evaluación Backend con Django REST, JWT & Swagger</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                document.getElementById('btnLogin').classList.add('d-none');
                document.getElementById('btnLogout').classList.remove('d-none');
            }
        });

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('username');
            window.location.href = '/';
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
