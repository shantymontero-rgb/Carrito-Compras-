{% extends 'store/base.html' %}
{% block title %}Acceso - CentralMarket{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-matcha p-4 text-center">
            <div class="mb-4">
                <div class="p-3 bg-success bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-lock-fill fs-2 text-success"></i>
                </div>
                <h3 class="fw-bold mb-1" style="color: #0b3d26;">Iniciar Sesión</h3>
                <small class="text-muted">Accede a tu cesta segura mediante token JWT</small>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none py-2 small rounded-3"></div>

            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Nombre de Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-person text-success"></i></span>
                        <input type="text" id="username" class="form-control border-0 bg-light" placeholder="admin" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-key text-success"></i></span>
                        <input type="password" id="password" class="form-control border-0 bg-light" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-matcha w-100 py-2 shadow-sm">
                    Acceder a mi Canasta
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('errorAlert');
    alertBox.classList.add('d-none');

    const userTyped = document.getElementById('username').value.trim();
    const passTyped = document.getElementById('password').value;

    const res = await fetch('/api/token/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: userTyped, password: passTyped })
    });

    const data = await res.json();
    if (res.ok && data.access) {
        localStorage.setItem('access_token', data.access);
        localStorage.setItem('username', userTyped);
        localStorage.setItem('show_welcome', 'true');
        window.location.href = '/cart/';
    } else {
        alertBox.textContent = data.detail || 'Usuario o contraseña no válidos.';
        alertBox.classList.remove('d-none');
    }
});
</script>
{% endblock %}
